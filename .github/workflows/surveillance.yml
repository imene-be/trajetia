# Déclenche la surveillance des perturbations toutes les 5 minutes (Vercel Hobby n'a pas de tâche planifiée aussi fréquente).
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
#   APP_URL      = https://votre-projet.vercel.app
#   CRON_SECRET  = la même valeur que la variable CRON_SECRET de Vercel
name: Surveillance des perturbations
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  surveiller:
    runs-on: ubuntu-latest
    steps:
      # Bloc « | » : la commande contient « Authorization: Bearer », dont le « : » casserait une valeur YAML sur une ligne
      - name: Appeler la surveillance
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Secrets APP_URL ou CRON_SECRET absents : surveillance ignorée."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/surveillance"
